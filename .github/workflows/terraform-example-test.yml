name: 'Terraform Example Test (reusable)'

# Reusable workflow that tests a single example in examples/<example>.
# Runs: init -> fmt check -> validate -> plan (no apply).
#
# Required repository secrets (used by all callers via `secrets: inherit`):
#   ARM_CLIENT_ID, ARM_CLIENT_SECRET, ARM_SUBSCRIPTION_ID, ARM_TENANT_ID, PASSWORD

on:
  workflow_call:
    inputs:
      example:
        description: 'Directory name under examples/'
        required: true
        type: string
      prefix:
        description: 'Short resource prefix used during plan'
        required: true
        type: string
      location:
        description: 'Azure region'
        required: false
        type: string
        default: 'westeurope'
      extra_tfvars:
        description: 'Optional extra variables (HCL), written to ci.auto.tfvars'
        required: false
        type: string
        default: ''
      deploy:
        description: 'When true, apply the plan and destroy afterwards (real deployment). Default: plan only.'
        required: false
        type: boolean
        default: false
      marketplace_offer:
        description: 'Azure Marketplace offer to accept terms for before deploying (only used when deploy=true)'
        required: false
        type: string
        default: ''
      marketplace_sku:
        description: 'Azure Marketplace plan/SKU to accept terms for before deploying (only used when deploy=true)'
        required: false
        type: string
        default: ''
      ssh_test_output:
        description: 'Name of the terraform output holding the FortiGate mgmt public IP. When set (and deploy=true), CI logs in over SSH and runs status commands after apply.'
        required: false
        type: string
        default: ''

jobs:
  terraform:
    name: "Terraform ${{ inputs.example ***REMOVED******REMOVED***${{ inputs.deploy && ' (deploy)' || '' ***REMOVED******REMOVED***"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TFPath: examples/${{ inputs.example ***REMOVED******REMOVED***
      TF_IN_AUTOMATION: 'true'
      TF_VAR_prefix: "${{ inputs.prefix ***REMOVED******REMOVED***-${{ github.run_number ***REMOVED******REMOVED***"
      TF_VAR_location: "${{ inputs.location ***REMOVED******REMOVED***"
      TF_VAR_username: "azureuser"
      TF_VAR_password: "${{ secrets.PASSWORD ***REMOVED******REMOVED***"
      TF_VAR_subscription_id: "${{ secrets.ARM_SUBSCRIPTION_ID ***REMOVED******REMOVED***"
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID ***REMOVED******REMOVED***
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET ***REMOVED******REMOVED***
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID ***REMOVED******REMOVED***
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID ***REMOVED******REMOVED***

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # wrapper breaks $(terraform output) command substitution

      - name: "Write extra tfvars"
        if: inputs.extra_tfvars != ''
        run: printf '%s\n' "${EXTRA_TFVARS***REMOVED***" > ci.auto.tfvars
        env:
          EXTRA_TFVARS: ${{ inputs.extra_tfvars ***REMOVED******REMOVED***
        working-directory: ${{ env.TFPath ***REMOVED******REMOVED***

      - name: "Terraform Init"
        id: init
        run: terraform init -input=false
        working-directory: ${{ env.TFPath ***REMOVED******REMOVED***

      - name: "Terraform Format"
        id: format
        run: terraform fmt -check -diff -recursive
        working-directory: ${{ env.TFPath ***REMOVED******REMOVED***

      - name: "Terraform Validate"
        id: validate
        run: terraform validate
        working-directory: ${{ env.TFPath ***REMOVED******REMOVED***

      - name: "Terraform Plan"
        id: plan
        run: terraform plan -input=false -out plan.tfplan
        working-directory: ${{ env.TFPath ***REMOVED******REMOVED***

      - name: "Plan Summary"
        run: terraform show -no-color plan.tfplan | tail -n 20
        working-directory: ${{ env.TFPath ***REMOVED******REMOVED***

      # ── Deployment steps below only run when deploy=true ────────────────────

      - name: "Accept Marketplace Terms"
        if: inputs.deploy && inputs.marketplace_offer != '' && inputs.marketplace_sku != ''
        run: |
          az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID" --output none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"
          az vm image terms accept \
            --publisher fortinet \
            --offer "${{ inputs.marketplace_offer ***REMOVED******REMOVED***" \
            --plan "${{ inputs.marketplace_sku ***REMOVED******REMOVED***" \
            --output none
          echo "Marketplace terms accepted for ${{ inputs.marketplace_offer ***REMOVED******REMOVED*** / ${{ inputs.marketplace_sku ***REMOVED******REMOVED***"

      - name: "Terraform Apply"
        id: apply
        if: inputs.deploy
        run: terraform apply -input=false -auto-approve plan.tfplan
        working-directory: ${{ env.TFPath ***REMOVED******REMOVED***

      - name: "Test - SSH login to FortiGate"
        if: inputs.deploy && inputs.ssh_test_output != '' && steps.apply.outcome == 'success'
        working-directory: ${{ env.TFPath ***REMOVED******REMOVED***
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y sshpass >/dev/null
          IP=$(terraform output -raw '${{ inputs.ssh_test_output ***REMOVED******REMOVED***')
          echo "FortiGate management IP: $IP"
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 $TF_VAR_username@$IP"
          # FortiGate needs a few minutes to boot after the VM is created: retry up to 10 minutes
          for i in $(seq 1 20); do
            if $SSH "get system status"; then
              echo "--- interfaces ---"
              $SSH "show system interface" || true
              echo "SSH test OK after $i attempt(s)"
              exit 0
            fi
            echo "FortiGate not reachable yet (attempt $i/20), retrying in 30s..."
            sleep 30
          done
          echo "::error::FortiGate did not become reachable over SSH within 10 minutes"
          exit 1
        env:
          SSHPASS: ${{ secrets.PASSWORD ***REMOVED******REMOVED***

      # Destroy always runs after an apply attempt (success OR failure),
      # so partially created resources are cleaned up and nothing keeps billing.
      - name: "Terraform Destroy"
        if: always() && inputs.deploy && contains(fromJSON('["success", "failure"]'), steps.apply.outcome)
        run: terraform destroy -input=false -auto-approve
        working-directory: ${{ env.TFPath ***REMOVED******REMOVED***
